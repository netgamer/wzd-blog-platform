<section class="search-panel" data-search-panel>
  <div class="search-panel-row">
    <label class="search-input-wrap">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input type="search" class="search-input" data-search-input placeholder="뉴스 검색" autocomplete="off" aria-label="뉴스 검색">
    </label>
    <div class="sort-controls" role="group" aria-label="정렬 방식">
      <button type="button" class="sort-btn active" data-sort="time">시간순</button>
      <button type="button" class="sort-btn" data-sort="popular">인기순</button>
    </div>
  </div>
  <div class="search-meta" data-search-meta>검색어를 입력하거나 정렬 방식을 선택하세요.</div>
  <div class="post-list search-results" data-search-results hidden></div>
</section>
