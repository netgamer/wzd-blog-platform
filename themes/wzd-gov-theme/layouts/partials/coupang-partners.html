{{- $cfg := .Site.Params.coupangPartners -}}
{{- if and $cfg.enabled $cfg.bannerHtml -}}
<aside class="coupang-partners-ad" aria-label="쿠팡파트너스 광고">
  <div class="coupang-partners-label">광고</div>
  <div class="coupang-partners-body">
    {{ $cfg.bannerHtml | safeHTML }}
  </div>
  {{ with $cfg.disclosure }}
  <p class="coupang-partners-disclosure">{{ . }}</p>
  {{ end }}
</aside>
{{- end -}}
