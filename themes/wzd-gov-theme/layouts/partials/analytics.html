{{ if .Site.Params.gaId }}
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var internal = false;
  try {
    if (params.get('internal') === '1') localStorage.setItem('wzd_internal', '1');
    if (params.get('internal') === '0') localStorage.removeItem('wzd_internal');
    internal = localStorage.getItem('wzd_internal') === '1';
  } catch (_) {}
  window.wzdTrack = function () {};
  if (location.hostname !== 'news.wzd.kr' || navigator.webdriver || internal) return;
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { window.dataLayer.push(arguments); };
  var script = document.createElement('script');
  script.async = true;
  script.src = 'https://www.googletagmanager.com/gtag/js?id={{ .Site.Params.gaId }}';
  document.head.appendChild(script);
  gtag('js', new Date());
  gtag('config', '{{ .Site.Params.gaId }}');
  window.wzdTrack = function (name, values) { gtag('event', name, values || {}); };
  document.addEventListener('DOMContentLoaded', function () {
    var body = document.querySelector('[itemprop="articleBody"]');
    var visibleSeconds = 0;
    var depthSent = false;
    var timer = setInterval(function () {
      if (document.visibilityState === 'visible') visibleSeconds++;
      if (!body || depthSent) { clearInterval(timer); return; }
      var rect = body.getBoundingClientRect();
      if (visibleSeconds >= 10 && rect.height > 0 && (innerHeight - rect.top) / rect.height >= 0.75 && rect.bottom > 0) {
        depthSent = true;
        wzdTrack('article_scroll_75', { article_path: location.pathname, visible_seconds: visibleSeconds });
      }
    }, 1000);
    document.addEventListener('click', function (event) {
      var target = event.target.closest('a, button');
      if (!target) return;
      var related = target.closest('.related-card');
      if (related) wzdTrack('related_article_click', { link_url: related.href });
      if (target.matches('[data-affiliate-link]')) wzdTrack('affiliate_click', { link_url: target.href, placement: target.dataset.affiliatePlacement || 'unknown' });
      if (target.dataset.shareChannel) wzdTrack('article_share_intent', { method: target.dataset.shareChannel, article_path: location.pathname });
      if (!target.href) return;
      var url = new URL(target.href, location.href);
      if (target.closest('[itemprop="articleBody"]') && /(^|\.)(go\.kr|korea\.kr)$/.test(url.hostname)) {
        wzdTrack('official_link_click', { link_url: url.href, article_path: location.pathname });
      }
      if (url.pathname.endsWith('.xml') && url.origin === location.origin) {
        wzdTrack('subscription_intent', { method: 'rss', link_url: url.href });
      }
    });
    document.querySelectorAll('.coupang-partners-ad').forEach(function (ad) {
      if ('IntersectionObserver' in window) new IntersectionObserver(function (entries, observer) {
        if (entries.some(function (entry) { return entry.isIntersecting && entry.intersectionRatio >= 0.5; })) {
          wzdTrack('affiliate_ad_view', { placement: 'article_body' });
          observer.disconnect();
        }
      }, { threshold: [0.5] }).observe(ad);
    });
  });
})();
</script>
{{ end }}
