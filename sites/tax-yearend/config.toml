baseURL = 'https://news.wzd.kr/'
languageCode = 'ko'
title = '오늘의트렌드'
theme = 'wzd-gov-theme'
[pagination]
  pagerSize = 10
enableRobotsTXT = true
canonifyURLs = true

[params]
  displayTitle = '오늘의 트렌드'
  titleSuffix = '실시간 이슈·정책·생활 뉴스'
  description = '오늘의트렌드(오늘의 트렌드)는 실시간 트렌드 뉴스, 경제, 건강, IT, 연예, 스포츠 등 오늘의 핫이슈를 빠르고 깊이 있게 전달합니다.'
  author = '오늘의 트렌드'
  gaId = 'G-X1VVEB9LME'
  adsenseId = ''
  naverVerification = ''
  keywords = ['오늘의트렌드', '오늘의 트렌드', 'news.wzd.kr', '실시간 뉴스', '트렌드 뉴스', '경제 뉴스', '건강 정보', 'IT 트렌드', '연예 뉴스', '스포츠 뉴스', '정책 정보', '생활 정보']

  [params.coupangPartners]
    enabled = true
    insertAfterParagraph = 3
    defaultBannerKey = 'interest'
    disclosure = '이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.'

    [params.coupangPartners.categoryMap]
      '경제' = 'interest'
      '산업' = 'interest'
      '사회' = 'interest'
      '세계' = 'interest'
      '문화' = 'interest'
      '건강' = 'interest'
      '연예' = 'interest'
      '스포츠' = 'interest'
      'IT' = 'interest'

    [params.coupangPartners.banners.interest]
      coupangCategory = '고객 관심 기반'
      bannerHtml = '''
<script src="https://ads-partners.coupang.com/g.js"></script>
<script>
  new PartnersCoupang.G({"id":1019681,"template":"carousel","trackingCode":"AF2196980","width":"680","height":"140","tsource":""});
</script>
'''
[taxonomies]
  category = 'categories'
  tag = 'tags'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS', 'JSON']

[sitemap]
  changefreq = 'daily'
  priority = 0.7

[related]
  threshold = 80
  includeNewer = true
  toLower = true
  [[related.indices]]
    name = 'tags'
    weight = 100
  [[related.indices]]
    name = 'categories'
    weight = 80
